[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarsiting"
version = "1.0.0"
description = "Global solar PV siting suitability from AlphaEarth geospatial embeddings (RF+MLP ensemble)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abdullah Rehman" }, { name = "Quentin Paletta" }, { name = "Rui Song" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scikit-learn==1.8.0",
  "joblib>=1.4",
  "threadpoolctl>=3.1",
  "pandas>=2.1",
  "pyarrow>=14",
  "rasterio>=1.4",
  "geopandas>=1.0",
  "pyogrio>=0.7",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/Abdullahr29/Global-Solar-Siting"

[tool.setuptools.packages.find]
where = ["src"]
